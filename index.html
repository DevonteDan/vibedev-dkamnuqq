<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Pet Age Translator — How old is your pet, really?</title>
<meta name="description" content="Convert your pet's age to human years. Dog, cat, rabbit, hamster, parrot."/>
<link rel="preconnect" href="https://fonts.googleapis.com"/><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500&family=Newsreader:ital,wght@1,400&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="style.css"/>
</head><body>
<noscript><p style="font-family:sans-serif;text-align:center;padding:40px">Requires JavaScript.</p></noscript>
<main class="page"><div class="widget" role="main" aria-label="Pet Age Translator">
<header class="w-header"><span class="dot" aria-hidden="true"></span><span class="eyebrow">Pet Age Translator</span></header>
<section aria-labelledby="ls"><p class="sec-label" id="ls">Choose your pet</p>
<div class="species-row" role="group" aria-label="Select species">

<div class="sp-item"><button class="sp-btn" data-sp="dog" aria-label="Select Dog" aria-pressed="true" id="btn-dog">
<svg class="sp-icon" viewBox="0 0 44 44" fill="none" aria-hidden="true">
<ellipse cx="22" cy="27" rx="12" ry="11" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
<path d="M10 22C6 18 5 10 8 6C10 3 14 4 14 9C14 14 12 19 10 22Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M34 22C38 18 39 10 36 6C34 3 30 4 30 9C30 14 32 19 34 22Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="17.5" cy="25" r="1.8" fill="currentColor"/>
<circle cx="26.5" cy="25" r="1.8" fill="currentColor"/>
<ellipse cx="22" cy="32" rx="4" ry="2.5" stroke="currentColor" stroke-width="1.6"/>
<path d="M19 32Q22 35.5 25 32" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
</svg></button>
<span class="sp-name" aria-hidden="true">Dog</span><div class="sp-line" aria-hidden="true"></div></div>

<div class="sp-item"><button class="sp-btn" data-sp="cat" aria-label="Select Cat" aria-pressed="false" id="btn-cat">
<svg class="sp-icon" viewBox="0 0 44 44" fill="none" aria-hidden="true">
<path d="M10 32C10 24 12 17 22 15C32 17 34 24 34 32C34 37 28.5 40 22 40C15.5 40 10 37 10 32Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M11 26L7 12L18 20" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M33 26L37 12L26 20" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<ellipse cx="17" cy="28" rx="2" ry="1.5" fill="currentColor"/>
<ellipse cx="27" cy="28" rx="2" ry="1.5" fill="currentColor"/>
<circle cx="22" cy="33" r="1.3" fill="currentColor"/>
<line x1="4" y1="31" x2="16" y2="32" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
<line x1="4" y1="34.5" x2="16" y2="33.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
<line x1="40" y1="31" x2="28" y2="32" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
<line x1="40" y1="34.5" x2="28" y2="33.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
</svg></button>
<span class="sp-name" aria-hidden="true">Cat</span><div class="sp-line" aria-hidden="true"></div></div>

<div class="sp-item"><button class="sp-btn" data-sp="rabbit" aria-label="Select Rabbit" aria-pressed="false" id="btn-rabbit">
<svg class="sp-icon" viewBox="0 0 44 44" fill="none" aria-hidden="true">
<ellipse cx="22" cy="30" rx="11" ry="10" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
<path d="M15 23C13 17 13 7 16 3C17 1.5 19.5 2 19.5 4.5C19.5 9 18 18 17 23" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M29 23C31 17 31 7 28 3C27 1.5 24.5 2 24.5 4.5C24.5 9 26 18 27 23" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="17.5" cy="28" r="1.8" fill="currentColor"/>
<circle cx="26.5" cy="28" r="1.8" fill="currentColor"/>
<circle cx="22" cy="33" r="2" fill="currentColor"/>
<path d="M19.5 33Q22 36.5 24.5 33" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
</svg></button>
<span class="sp-name" aria-hidden="true">Rabbit</span><div class="sp-line" aria-hidden="true"></div></div>

<div class="sp-item"><button class="sp-btn" data-sp="hamster" aria-label="Select Hamster" aria-pressed="false" id="btn-hamster">
<svg class="sp-icon" viewBox="0 0 44 44" fill="none" aria-hidden="true">
<circle cx="22" cy="24" r="14" stroke="currentColor" stroke-width="2"/>
<path d="M8 24C5 20 5.5 13 9 11" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
<path d="M36 24C39 20 38.5 13 35 11" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
<path d="M15 11C14 8 16 7 18 8.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
<path d="M29 11C30 8 28 7 26 8.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
<circle cx="16" cy="21" r="2.5" fill="currentColor"/>
<circle cx="28" cy="21" r="2.5" fill="currentColor"/>
<circle cx="22" cy="27" r="1.5" fill="currentColor"/>
<path d="M19.5 27Q22 30.5 24.5 27" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
</svg></button>
<span class="sp-name" aria-hidden="true">Hamster</span><div class="sp-line" aria-hidden="true"></div></div>

<div class="sp-item"><button class="sp-btn" data-sp="parrot" aria-label="Select Parrot" aria-pressed="false" id="btn-parrot">
<svg class="sp-icon" viewBox="0 0 44 44" fill="none" aria-hidden="true">
<circle cx="22" cy="26" r="13" stroke="currentColor" stroke-width="2"/>
<path d="M17 14C15 9 16 5 19 7" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
<path d="M21 13C20 8 21.5 5 24 7.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
<path d="M25 15C25 10 27 7 29 10" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
<circle cx="27" cy="23" r="4" stroke="currentColor" stroke-width="1.8"/>
<circle cx="27" cy="23" r="1.8" fill="currentColor"/>
<path d="M17 27C15 25 14.5 22 16 21C17.5 20 19 21.5 18.5 24" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M18.5 24C18.5 27 17 28.5 17 27" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
</svg></button>
<span class="sp-name" aria-hidden="true">Parrot</span><div class="sp-line" aria-hidden="true"></div></div>

</div></section>
<div class="sep" aria-hidden="true"></div>
<section aria-labelledby="la">
<label class="sec-label" for="age-input" id="la">How old is your pet?</label>
<div class="age-row">
<button class="step-btn" id="btn-dec" aria-label="Decrease age"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M15 5L7 12L15 19" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
<div class="age-wrap"><input type="number" id="age-input" class="age-inp" min="0" max="25" step="1" placeholder="—" autocomplete="off" aria-describedby="age-unit"/><div class="age-ul" aria-hidden="true"></div></div>
<button class="step-btn" id="btn-inc" aria-label="Increase age"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M9 5L17 12L9 19" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
</div>
<span class="age-unit" id="age-unit" aria-hidden="true">years old</span>
</section>
<div class="dot-rule" aria-hidden="true"></div>
<section class="result-sec" id="result-sec" aria-live="polite" aria-atomic="false" aria-label="Translation result">
<div class="r-empty" id="r-empty"><p class="r-empty-txt">Enter your pet's age to see the result</p></div>
<div class="r-content" id="r-content" aria-hidden="true">
<div class="r-num-wrap"><span class="r-num" id="r-num" aria-label="Human equivalent age">0</span><div class="r-sweep" id="r-sweep" aria-hidden="true"></div></div>
<p class="r-label">human years</p>
<div class="badge-wrap" id="badge-wrap"><span class="badge" id="badge" role="status"><span class="badge-icon" id="badge-icon" aria-hidden="true"></span><span class="badge-txt" id="badge-txt">Newborn</span></span></div>
<p class="flavour" id="flavour" aria-label="Description"></p>
</div>
</section>
<footer class="w-footer"><p>For fun only &mdash; no data is ever saved.</p></footer>
</div></main>
<script src="script.js"></script>
</body></html>
