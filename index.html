<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pet Age Translator — How old is your pet, really?</title>
  <meta name="description" content="Translate your pet's age into human years. Find out your dog, cat, rabbit, hamster, or parrot's life stage instantly — no sign-up, no data saved." />
  <meta name="theme-color" content="#F6F1E7" />

  <!-- Google Fonts: Space Grotesk, Fraunces, Newsreader -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..900;1,9..144,300..900&family=Newsreader:ital,wght@1,400;1,500&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="style.css" />

  <!-- SVG noise texture filter (inline, zero network request) -->
  <svg width="0" height="0" style="position:absolute">
    <filter id="noise-filter">
      <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch" result="noiseOut" />
      <feColorMatrix type="saturate" values="0" in="noiseOut" result="grayNoise" />
      <feBlend in="SourceGraphic" in2="grayNoise" mode="overlay" result="blended" />
      <feComposite in="blended" in2="SourceGraphic" operator="in" />
    </filter>
  </svg>
</head>
<body>
  <noscript>
    <div style="font-family:sans-serif;text-align:center;padding:40px;background:#F6F1E7;color:#22201D;">
      <strong>Pet Age Translator</strong> requires JavaScript to work. Please enable JavaScript in your browser.
    </div>
  </noscript>

  <main class="page-wrapper">
    <div class="widget" role="main" aria-label="Pet Age Translator">

      <!-- Eyebrow / Header -->
      <header class="widget__header">
        <span class="widget__dot" aria-hidden="true"></span>
        <span class="widget__eyebrow">Pet Age Translator</span>
      </header>

      <!-- Species Selector -->
      <section class="species-section" aria-labelledby="species-label">
        <p class="section-label" id="species-label">Choose your pet</p>
        <div class="species-selector" role="group" aria-label="Select pet species">
          <!-- Dog -->
          <div class="species-item">
            <button
              class="species-btn"
              data-species="dog"
              aria-label="Select Dog"
              aria-pressed="true"
              id="btn-dog"
            >
              <svg class="species-icon" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                <!-- Dog head with floppy ears -->
                <ellipse cx="16" cy="17" rx="9" ry="8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                <!-- Left floppy ear -->
                <path d="M7.5 13C6 10.5 5.5 7 7 5.5C8.5 4 10.5 5 10.5 8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                <!-- Right floppy ear -->
                <path d="M24.5 13C26 10.5 26.5 7 25 5.5C23.5 4 21.5 5 21.5 8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                <!-- Eyes -->
                <circle cx="13" cy="16" r="1" fill="currentColor"/>
                <circle cx="19" cy="16" r="1" fill="currentColor"/>
                <!-- Nose -->
                <path d="M14.5 19.5 Q16 21 17.5 19.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
              </svg>
            </button>
            <span class="species-label-text" aria-hidden="true">Dog</span>
            <div class="species-underline" aria-hidden="true"></div>
          </div>

          <!-- Cat -->
          <div class="species-item">
            <button
              class="species-btn"
              data-species="cat"
              aria-label="Select Cat"
              aria-pressed="false"
              id="btn-cat"
            >
              <svg class="species-icon" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                <!-- Cat head (slightly triangular) -->
                <path d="M7 22 C7 22 7 13 16 12 C25 13 25 22 25 22 C25 25 21 27 16 27 C11 27 7 25 7 22Z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                <!-- Left ear -->
                <path d="M8 16 L6 9 L13 13" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                <!-- Right ear -->
                <path d="M24 16 L26 9 L19 13" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                <!-- Eyes -->
                <circle cx="13" cy="19" r="1" fill="currentColor"/>
                <circle cx="19" cy="19" r="1" fill="currentColor"/>
                <!-- Whiskers left -->
                <line x1="6" y1="22" x2="13" y2="22.5" stroke="currentColor" stroke-width="1" stroke-linecap="round"/>
                <line x1="6" y1="24" x2="13" y2="23.5" stroke="currentColor" stroke-width="1" stroke-linecap="round"/>
                <!-- Whiskers right -->
                <line x1="26" y1="22" x2="19" y2="22.5" stroke="currentColor" stroke-width="1" stroke-linecap="round"/>
                <line x1="26" y1="24" x2="19" y2="23.5" stroke="currentColor" stroke-width="1" stroke-linecap="round"/>
              </svg>
            </button>
            <span class="species-label-text" aria-hidden="true">Cat</span>
            <div class="species-underline" aria-hidden="true"></div>
          </div>

          <!-- Rabbit -->
          <div class="species-item">
            <button
              class="species-btn"
              data-species="rabbit"
              aria-label="Select Rabbit"
              aria-pressed="false"
              id="btn-rabbit"
            >
              <svg class="species-icon" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                <!-- Rabbit head -->
                <ellipse cx="16" cy="22" rx="8" ry="6.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                <!-- Left tall ear -->
                <path d="M11 17 C10 14 10 8 12.5 5 C13.5 3.5 14.5 4 14.5 5.5 C14.5 8.5 13.5 13 13 17" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                <!-- Right tall ear -->
                <path d="M21 17 C22 14 22 8 19.5 5 C18.5 3.5 17.5 4 17.5 5.5 C17.5 8.5 18.5 13 19 17" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                <!-- Eyes -->
                <circle cx="13" cy="21" r="1" fill="currentColor"/>
                <circle cx="19" cy="21" r="1" fill="currentColor"/>
                <!-- Nose -->
                <circle cx="16" cy="24" r="0.8" fill="currentColor"/>
              </svg>
            </button>
            <span class="species-label-text" aria-hidden="true">Rabbit</span>
            <div class="species-underline" aria-hidden="true"></div>
          </div>

          <!-- Hamster -->
          <div class="species-item">
            <button
              class="species-btn"
              data-species="hamster"
              aria-label="Select Hamster"
              aria-pressed="false"
              id="btn-hamster"
            >
              <svg class="species-icon" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                <!-- Hamster chubby round head -->
                <circle cx="16" cy="17" r="10" stroke="currentColor" stroke-width="1.5"/>
                <!-- Chubby cheeks -->
                <path d="M6 17 C5 14 5.5 12 7 12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                <path d="M26 17 C27 14 26.5 12 25 12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                <!-- Tiny ears (subtle bumps) -->
                <path d="M11 8 C11 6.5 13 6 13 7.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                <path d="M21 8 C21 6.5 19 6 19 7.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                <!-- Eyes -->
                <circle cx="13" cy="16" r="1.2" fill="currentColor"/>
                <circle cx="19" cy="16" r="1.2" fill="currentColor"/>
                <!-- Nose -->
                <circle cx="16" cy="19.5" r="0.8" fill="currentColor"/>
              </svg>
            </button>
            <span class="species-label-text" aria-hidden="true">Hamster</span>
            <div class="species-underline" aria-hidden="true"></div>
          </div>

          <!-- Parrot -->
          <div class="species-item">
            <button
              class="species-btn"
              data-species="parrot"
              aria-label="Select Parrot"
              aria-pressed="false"
              id="btn-parrot"
            >
              <svg class="species-icon" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                <!-- Parrot head (rounder top) -->
                <path d="M9 20 C9 14 11 9 16 8 C21 7 24 12 24 17 C24 22 21 26 16 26 C11 26 9 24 9 20Z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                <!-- Crest feathers on top -->
                <path d="M14 8 C13 5 14 3 16 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                <path d="M16 8 C16 5 17 3 18 4.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                <!-- Eye -->
                <circle cx="18" cy="16" r="1.2" fill="currentColor"/>
                <!-- Curved beak -->
                <path d="M14 20 C13 19 12.5 17.5 13.5 17 C14.5 16.5 15.5 17.5 15 18.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M15 18.5 C15 20 14 21 14 20" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
              </svg>
            </button>
            <span class="species-label-text" aria-hidden="true">Parrot</span>
            <div class="species-underline" aria-hidden="true"></div>
          </div>
        </div>
      </section>

      <!-- Separator line -->
      <div class="separator-line" aria-hidden="true"></div>

      <!-- Age Input -->
      <section class="age-section" aria-labelledby="age-label">
        <label class="section-label" for="age-input" id="age-label">How old is your pet?</label>
        <div class="age-input-wrapper">
          <button class="stepper-btn stepper-btn--minus" id="btn-decrease" aria-label="Decrease age" tabindex="0">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <!-- Left bracket angle -->
              <path d="M15 5 L7 12 L15 19" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>

          <div class="age-display-wrapper">
            <input
              type="number"
              id="age-input"
              class="age-input"
              min="0"
              max="25"
              step="1"
              placeholder="—"
              aria-describedby="age-unit"
              autocomplete="off"
            />
            <div class="age-input-underline" aria-hidden="true"></div>
          </div>

          <button class="stepper-btn stepper-btn--plus" id="btn-increase" aria-label="Increase age" tabindex="0">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <!-- Right bracket angle -->
              <path d="M9 5 L17 12 L9 19" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
        </div>
        <span class="age-unit" id="age-unit" aria-hidden="true">years old</span>
      </section>

      <!-- Dotted Rule Divider -->
      <div class="dotted-rule" aria-hidden="true">
        <svg width="100%" height="6" viewBox="0 0 380 6" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
          <!-- Organic dotted rule: varying dot sizes -->
          <circle cx="4" cy="3" r="1.5" fill="currentColor"/>
          <circle cx="14" cy="3" r="1" fill="currentColor"/>
          <circle cx="22" cy="3" r="1.8" fill="currentColor"/>
          <circle cx="32" cy="3" r="1.2" fill="currentColor"/>
          <circle cx="42" cy="3" r="1" fill="currentColor"/>
          <circle cx="51" cy="3" r="1.6" fill="currentColor"/>
          <circle cx="61" cy="3" r="1.1" fill="currentColor"/>
          <circle cx="71" cy="3" r="1.9" fill="currentColor"/>
          <circle cx="80" cy="3" r="1" fill="currentColor"/>
          <circle cx="90" cy="3" r="1.4" fill="currentColor"/>
          <circle cx="100" cy="3" r="1.7" fill="currentColor"/>
          <circle cx="110" cy="3" r="1" fill="currentColor"/>
          <circle cx="119" cy="3" r="1.3" fill="currentColor"/>
          <circle cx="129" cy="3" r="1.8" fill="currentColor"/>
          <circle cx="139" cy="3" r="1" fill="currentColor"/>
          <circle cx="148" cy="3" r="1.5" fill="currentColor"/>
          <circle cx="158" cy="3" r="1.1" fill="currentColor"/>
          <circle cx="168" cy="3" r="1.9" fill="currentColor"/>
          <circle cx="178" cy="3" r="1.2" fill="currentColor"/>
          <circle cx="188" cy="3" r="1" fill="currentColor"/>
          <circle cx="197" cy="3" r="1.6" fill="currentColor"/>
          <circle cx="207" cy="3" r="1.3" fill="currentColor"/>
          <circle cx="217" cy="3" r="1" fill="currentColor"/>
          <circle cx="226" cy="3" r="1.8" fill="currentColor"/>
          <circle cx="236" cy="3" r="1.1" fill="currentColor"/>
          <circle cx="246" cy="3" r="1.5" fill="currentColor"/>
          <circle cx="256" cy="3" r="1" fill="currentColor"/>
          <circle cx="265" cy="3" r="1.7" fill="currentColor"/>
          <circle cx="275" cy="3" r="1.2" fill="currentColor"/>
          <circle cx="285" cy="3" r="1" fill="currentColor"/>
          <circle cx="294" cy="3" r="1.4" fill="currentColor"/>
          <circle cx="304" cy="3" r="1.8" fill="currentColor"/>
          <circle cx="314" cy="3" r="1" fill="currentColor"/>
          <circle cx="323" cy="3" r="1.6" fill="currentColor"/>
          <circle cx="333" cy="3" r="1.1" fill="currentColor"/>
          <circle cx="343" cy="3" r="1.9" fill="currentColor"/>
          <circle cx="352" cy="3" r="1" fill="currentColor"/>
          <circle cx="362" cy="3" r="1.5" fill="currentColor"/>
          <circle cx="372" cy="3" r="1.3" fill="currentColor"/>
          <circle cx="380" cy="3" r="1" fill="currentColor"/>
        </svg>
      </div>

      <!-- Result Area -->
      <section
        class="result-section"
        id="result-section"
        aria-live="polite"
        aria-atomic="false"
        aria-label="Translation result"
      >
        <!-- Empty state -->
        <div class="result-empty" id="result-empty">
          <p class="result-empty__text">Enter your pet's age to see the result</p>
        </div>

        <!-- Result content (hidden initially) -->
        <div class="result-content" id="result-content" aria-hidden="true">
          <!-- Hero number -->
          <div class="result-number-wrap">
            <span class="result-number" id="result-number" aria-label="Human equivalent age">0</span>
            <div class="result-number-underline" id="result-underline" aria-hidden="true"></div>
          </div>
          <p class="result-label">human years</p>

          <!-- Life-stage Badge -->
          <div class="badge-wrap" id="badge-wrap">
            <span class="stage-badge" id="stage-badge" role="status">
              <span class="badge-icon" id="badge-icon" aria-hidden="true">
                <!-- SVG inserted by JS -->
              </span>
              <span class="badge-text" id="badge-text">Newborn</span>
            </span>
          </div>

          <!-- Flavour sentence -->
          <p class="flavour-text" id="flavour-text" aria-label="Flavour description"></p>
        </div>
      </section>

      <!-- Footer -->
      <footer class="widget__footer">
        <p>For fun only &mdash; no data is ever saved.</p>
      </footer>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
